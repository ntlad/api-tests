name: Docker API tests

on: [push]

permissions:
  contents: read

jobs:
  docker-tests:
    name: Build and run API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t api-test .

      - name: Run API tests in Docker
        run: docker run --rm api-test
